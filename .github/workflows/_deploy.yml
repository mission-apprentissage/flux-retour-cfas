name: Deployment
on:
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to deploy to
        type: choice
        required: true
        options:
          - production
          - recette
          - preprod
      app_version:
        description: app version
        type: string
        required: true
        default: latest
  workflow_call:
    inputs:
      environment:
        description: The environment to deploy to
        type: string
        default: latest
        required: false
      app_version:
        description: app version
        type: string
        required: false
        default: latest
    secrets:
      SLACK_WEBHOOK_NOTIF:
        description: Slack webhook notif URL
        required: true
      SLACK_WEBHOOK_ALERTING:
        description: Slack webhook alerting URL
        required: true
      OPENPGP_PRIVATE_SUBKEY:
        description: Github Actions' OpenPGP private subkey (notification Sentry)
        required: true

jobs:
  version:
    name: Get Version
    runs-on: ubuntu-26.04
    outputs:
      VERSION: ${{ steps.get-version.outputs.VERSION }}
    steps:
      - name: Checkout project
        if: ${{ inputs.app_version == 'latest' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get Version
        id: get-version
        shell: bash
        run: |
          if [[ "${APP_VERSION}" == "latest" ]]; then
            echo "VERSION=$(git describe --tags --abbrev=0 --candidates 100 --always | cut -c 2-)" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          fi
        env:
          APP_VERSION: ${{ inputs.app_version }}

      - name: Notify new deployment on Slack
        uses: ravsamhq/notify-slack-action@v2
        if: always()
        with:
          status: ${{ job.status }}
          notification_title: "Déploiement ${{ steps.get-version.outputs.VERSION }} en ${{ inputs.environment }} initié..."
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_NOTIF }}

  deploy:
    if: ${{ success() }}
    needs: ["version"]
    name: Deploy ${{ needs.version.outputs.VERSION }} on ${{ inputs.environment }}
    # Runner prive (nouvelle infra) : seul chemin vers tdb.<env>.ssh.mna.internal.
    # Ce job a la cle SSH du parc TDB a portee : uniquement le playbook et les
    # journaux, aucune installation de dependances ni action tierce.
    # Notifications Slack et Sentry : job notify, sur un runner heberge.
    runs-on: [self-hosted, deploy-tdb]
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          submodules: true
          persist-credentials: false

      - name: Run playbook
        run: .bin/mna app:deploy ${{ inputs.environment }} --extra-vars "app_version=${{ needs.version.outputs.VERSION }}"
        env:
          ANSIBLE_REMOTE_USER: runner-deploy
          ANSIBLE_SKIP_GALAXY: "true"

      - name: Encrypt logs
        run: .bin/mna app:deploy:log:encrypt
        if: always()

      - name: Upload logs artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ inputs.environment }}
          path: /tmp/deploy.log.gpg

      - name: Add Job summary
        if: always()
        run: |
          # shellcheck disable=SC2016 # les backticks sont du markdown, pas une substitution shell
          echo 'You can get logs using `.bin/mna app:deploy:log:decrypt ${{ github.run_id }} ${{ inputs.environment }}`' >> "$GITHUB_STEP_SUMMARY"

  notify:
    if: ${{ always() && needs.deploy.result != 'skipped' }}
    needs: ["version", "deploy"]
    name: Notify ${{ needs.deploy.result }} on ${{ inputs.environment }}
    runs-on: ubuntu-26.04
    steps:
      - name: Notify failure on Slack
        uses: ravsamhq/notify-slack-action@v2
        if: always()
        with:
          status: ${{ needs.deploy.result }}
          notification_title: "Le déploiement ${{ inputs.app_version }} en ${{ inputs.environment }} a échoué"
          message_format: "{emoji} *[${{ inputs.environment }}]* *{workflow}* {status_message} in <{repo_url}|{branch}> on <{commit_url}|{commit_sha}>. You can get error logs using `.bin/mna app:deploy:log:decrypt ${{ github.run_id }} ${{ inputs.environment }}`"
          notify_when: "failure"
          mention_groups: "!channel"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_ALERTING }}

      - name: Notify success on Slack
        uses: ravsamhq/notify-slack-action@v2
        if: always()
        with:
          status: ${{ needs.deploy.result }}
          notification_title: "Déploiement ${{ inputs.app_version }} en ${{ inputs.environment }} terminé avec {status_message}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_NOTIF }}

      - name: Checkout project
        if: ${{ needs.deploy.result == 'success' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          submodules: true

      - name: Setup project
        if: ${{ needs.deploy.result == 'success' }}
        uses: ./.github/actions/setup-project
        with:
          openpgp-key: ${{ secrets.OPENPGP_PRIVATE_SUBKEY }}

      - name: Notify sentry that a new version has been deployed
        if: ${{ needs.deploy.result == 'success' }}
        run: .bin/mna sentry:deploy ${{ inputs.environment }} ${{ needs.version.outputs.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ env.GITHUB_REF_NAME }}
