name: Sync Preprod
on:
  workflow_dispatch:

jobs:
  notify-start:
    name: Notification de démarrage
    runs-on: ubuntu-26.04
    steps:
      - name: Notify new deployment on Slack
        uses: ravsamhq/notify-slack-action@v2
        if: always()
        with:
          status: ${{ job.status }}
          notification_title: "Synchronisation de la base de donnée Production -> Preprod initié..."
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  deploy:
    needs: ["notify-start"]
    name: Synchronisation de la base de donnée Production -> Preprod
    # Runner prive (nouvelle infra) : seul chemin vers tdb.production.ssh.mna.internal.
    # Le playbook attend jusqu'a 3 h : le runner TDB est occupe pendant ce temps.
    runs-on: [self-hosted, deploy-tdb]
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          submodules: true
          persist-credentials: false

      - name: Run playbook
        run: .bin/mna preprod:sync
        env:
          ANSIBLE_REMOTE_USER: runner-deploy
          ANSIBLE_SKIP_GALAXY: "true"

      - name: Encrypt logs
        run: .bin/mna app:deploy:log:encrypt
        if: always()

      - name: Upload logs artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-sync-preprod
          path: /tmp/deploy.log.gpg

      - name: Add Job summary
        if: always()
        run: |
          # shellcheck disable=SC2016 # les backticks sont du markdown, pas une substitution shell
          echo 'You can get logs using `.bin/mna app:deploy:log:decrypt ${{ github.run_id }} sync-preprod`' >> "$GITHUB_STEP_SUMMARY"

  notify:
    if: ${{ always() && needs.deploy.result != 'skipped' }}
    needs: ["deploy"]
    name: Notification de fin
    runs-on: ubuntu-26.04
    steps:
      - name: Notify failure on Slack
        uses: ravsamhq/notify-slack-action@v2
        if: always()
        with:
          status: ${{ needs.deploy.result }}
          notification_title: "La synchronisation de la base de donnée Production -> Preprod a échoué"
          notify_when: "failure"
          mention_groups: "!channel"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify success on Slack
        uses: ravsamhq/notify-slack-action@v2
        if: always()
        with:
          status: ${{ needs.deploy.result }}
          notification_title: "Synchronisation de la base de donnée Production -> Preprod terminé avec succès"
          notify_when: "success"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
